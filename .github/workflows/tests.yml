name: Unit Tests

on:
  push:
    branches: [main, joss-review-edits]
  pull_request:
    branches: [main, joss-review-edits]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Install coverage tools
        run: python -m pip install coverage coverage-badge
      - name: Run unittest with coverage
        run: |
          python -m coverage run --rcfile=.github/.coveragerc -m unittest discover -v -s tests -p "test_assetra.py"
          python -m coverage report --rcfile=.github/.coveragerc
      - name: Generate coverage badge
        run: python -m coverage_badge -o .github/coverage.svg -f
      - name: Commit updated badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push
        
