name: Unit Tests and Matrix Testing

on:
  push:
    branches: [main, joss-review-edits]
  pull_request:
    branches: [main, joss-review-edits]

permissions:
  contents: write

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Experimental versions still run and still report into the README matrix,
    # but they do not fail the workflow run (and so do not redden the badge).
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - python-version: '3.14'
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Install coverage tools
        run: poetry run python -m pip install coverage coverage-badge

      - name: Probe environment
        run: |
          poetry run python -c "import sys; print(sys.version)"
          poetry run python -c "import netCDF4; print('netCDF4', netCDF4.__version__, '| hdf5', netCDF4.__hdf5libversion__)"
          poetry run pip list | grep -iE "h5py|h5netcdf|netcdf|hdf|numpy|cftime" || true

      - name: Probe netCDF4 import (faulthandler)
        run: poetry run python -X faulthandler -c "import netCDF4; print('import OK')"

      - name: Run unittest with coverage
        run: |
          poetry run python -X faulthandler -m coverage run --rcfile=.github/.coveragerc -m unittest discover -v -s tests -p "test_assetra.py"
          poetry run python -m coverage report --rcfile=.github/.coveragerc

      - name: Generate coverage badge
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: poetry run python -m coverage_badge -o .github/coverage.svg -f

      - name: Commit updated badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push

  update-matrix-badges:
    name: Update README Matrix Badges
    needs: test
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/joss-review-edits')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test job results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            let matrixStatus = {};
            for (const job of response.data.jobs) {
              if (job.name.includes('Python')) {
                // Extracts "3.10", "3.11" etc. and "ubuntu-latest", "windows-latest"
                const osMatch = job.name.includes('ubuntu') ? 'ubuntu' : 'windows';
                const pyMatch = job.name.match(/3\.\d+/)[0];
                const key = `${osMatch}_${pyMatch.replace('.', '')}`;
                // Read the test step directly, not job.conclusion: a job marked
                // continue-on-error reports conclusion 'success' even when it failed,
                // which would silently turn a broken cell green.
                const testStep = (job.steps || []).find(
                  s => s.name === 'Run unittest with coverage'
                );
                const passed = testStep
                  ? testStep.conclusion === 'success'
                  : job.conclusion === 'success';
                matrixStatus[key] = passed ? 'passing-brightgreen' : 'failing-red';
              }
            }
            fs.writeFileSync('matrix_status.json', JSON.stringify(matrixStatus));

      - name: Update README.rst
        run: |
          python -c "
          import json, re

          with open('matrix_status.json') as f:
              status = json.load(f)

          with open('README.rst', 'r') as f:
              content = f.read()

          for key, state in status.items():
              # Regex updates status color in badge image directives like .. |ub-310| image:: ...
              pattern = rf'(\.\.\s+\|{key}\|\s+image::\s+https://img\.shields\.io/badge/Python_[0-9\.]+-)(passing-brightgreen|failing-red|untested-yellow)'
              content = re.sub(pattern, rf'\1{state}', content)

          with open('README.rst', 'w') as f:
              f.write(content)
          "

      - name: Open PR for README matrix badge update
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update platform matrix badges in README [skip ci]"
          title: "Update platform matrix badges in README"
          body: "Automated update of the Python/OS support matrix badges in `README.rst` based on the latest test results."
          branch: "auto/readme-matrix-badges"
          delete-branch: true
          add-paths: |
            README.rst